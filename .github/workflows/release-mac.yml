name: Build & Release macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Apple Silicon (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Go backend (darwin/arm64)
        run: |
          mkdir -p web/resources
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o web/resources/hn-local ./cmd/local
          chmod +x web/resources/hn-local
          cp tag_mappings.json web/resources/tag_mappings.json

      - name: Install frontend dependencies & package Electron macOS app
        working-directory: web
        env:
          VITE_ELECTRON: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npx tsc -b
          npx vite build
          npx electron-builder --mac --arm64 --config.mac.identity=null

      - name: Upload HN.Station-0.10.0-arm64.dmg to GitHub Release v0.10.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_PATH=$(ls web/release/*-arm64.dmg | head -n 1)
          echo "Uploading $DMG_PATH to release v0.10.0..."
          gh release upload v0.10.0 "${DMG_PATH}#HN.Station-0.10.0-arm64.dmg" --clobber
